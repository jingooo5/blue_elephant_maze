<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>마무리 영상</title>
<link rel="stylesheet" href="styles.css">
<script src="game.js" defer></script>
</head>
<body class="video" data-prev="page6.html">

  <!--
    ==========================================================
      영상을 바꾸려면 아래 주소의 영상 ID(VRwYOLTuL7c)만 바꾸면 됩니다.

      autoplay=1 을 넣어 뒀지만, 브라우저가 소리 있는 자동재생을 막으면
      가운데 재생 버튼이 뜹니다. 그때는 진행자가 한 번 눌러 주면 됩니다.
      (소리를 포기하고 무조건 자동재생하려면 뒤에 &mute=1 을 붙이세요)
    ==========================================================
  -->
  <iframe class="video__frame"
          src="https://www.youtube.com/embed/VRwYOLTuL7c?autoplay=1&amp;rel=0&amp;playsinline=1"
          title="마무리 영상"
          allow="autoplay; encrypted-media; fullscreen"
          allowfullscreen></iframe>

  <!-- data-reset: 위쪽 타이머의 초기화와 똑같이 동작합니다 (game.js) -->
  <button class="resetlink" type="button" data-reset>
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
      <path d="M13.5 8a5.5 5.5 0 1 1-1.9-4.16" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round"/>
      <path d="M13.2 1.6v2.8h-2.8" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    초기화
  </button>

</body>
</html>
