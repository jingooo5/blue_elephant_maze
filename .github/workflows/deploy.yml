name: Vercel Deploy

# main 에 push → 프로덕션 배포
# PR → 미리보기(preview) 배포
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치에서 연속 push 시 이전 실행은 취소
concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

# 비밀값이 아닌 식별자지만, public 저장소라 Secrets 로 주입합니다.
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "env=preview" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### ✅ ${{ steps.target.outputs.env }} 배포 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
