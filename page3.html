<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>비밀 대화방</title>
<link rel="stylesheet" href="styles.css">
<script src="game.js" defer></script>
</head>
<body class="kakao-gate" data-prev="photo.html">

  <div class="kakao-gate__phone">

    <div class="kakao-gate__notch" aria-hidden="true"></div>

    <!-- 팝업 뒤로 살짝 흐려 보이는 채팅방. 실제 대화 내용은 없고
         말풍선 모양만 있는 자리표시자입니다. -->
    <div class="kakao-gate__screen" aria-hidden="true">
      <div class="kakao-gate__status">
        <span>오후 4:34</span>
        <span class="kakao-gate__status-icons">
          <svg viewBox="0 0 20 14" width="14" height="10">
            <path d="M10 12.2a1.35 1.35 0 1 0 0-2.7 1.35 1.35 0 0 0 0 2.7Z" fill="currentColor"/>
            <path d="M6.6 8.4a5 5 0 0 1 6.8 0M3.7 5.4a9.2 9.2 0 0 1 12.6 0M1 2.6a13.3 13.3 0 0 1 18 0"
                  fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg viewBox="0 0 26 13" width="19" height="10">
            <rect x=".75" y=".75" width="21.5" height="11.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".55"/>
            <rect x="2.75" y="2.75" width="6.5" height="7.5" rx="1.5" fill="currentColor"/>
            <path d="M24 4.5v4a2.2 2.2 0 0 0 0-4Z" fill="currentColor" opacity=".55"/>
          </svg>
        </span>
      </div>

      <div class="kakao-gate__header">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3 5 8l5 5"/>
        </svg>
        <span class="kakao-gate__header-title">🔒 비밀 대화방</span>
        <svg viewBox="0 0 16 16" width="16" height="16" fill="#fff">
          <circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/>
        </svg>
      </div>

      <div class="kakao-gate__body">
        <div class="kakao-gate__bubble kakao-gate__bubble--m"></div>
        <div class="kakao-gate__bubble kakao-gate__bubble--l"></div>
        <div class="kakao-gate__bubble kakao-gate__bubble--right kakao-gate__bubble--s"></div>
        <div class="kakao-gate__bubble kakao-gate__bubble--m"></div>
        <div class="kakao-gate__bubble kakao-gate__bubble--right kakao-gate__bubble--m"></div>
        <div class="kakao-gate__bubble kakao-gate__bubble--right kakao-gate__bubble--s"></div>
        <div class="kakao-gate__bubble kakao-gate__bubble--l"></div>
      </div>
    </div>

    <div class="kakao-gate__dim" aria-hidden="true"></div>

    <!-- iOS 시스템 팝업 형태의 비밀번호 입력창 -->
    <div class="ios-alert">
      <!-- novalidate: 브라우저 기본 경고 대신 game.js 가 판정합니다
           (자리수를 다 채우고 확인을 눌렀을 때만 경고, lock.html 과 동일) -->
      <form class="login" action="page4.html" method="get" novalidate>
        <div class="ios-alert__body">
          <p class="ios-alert__title">비밀번호 입력</p>
          <p class="ios-alert__message">이 대화방을 보려면<br>비밀번호를 입력하세요</p>

          <!--
            비밀번호는 pattern 값 하나만 고치면 됩니다. 현재: 1388
            자리수는 game.js 가 pattern 길이를 보고 알아서 맞춥니다.
          -->
          <input class="field__input ios-alert__input"
                 type="password"
                 pattern="1388"
                 required
                 placeholder="••••"
                 autocomplete="off"
                 spellcheck="false"
                 autofocus>

          <p class="error" role="status">비밀번호가 올바르지 않습니다.</p>
        </div>

        <div class="ios-alert__actions">
          <a class="ios-alert__btn ios-alert__btn--cancel" href="photo.html">취소</a>
          <button class="ios-alert__btn ios-alert__btn--ok" type="submit">확인</button>
        </div>
      </form>
    </div>

  </div>

</body>
</html>
